appId: com.himanshugarg.fullcode
productName: FullCode IDE
copyright: Copyright © 2026 Himanshu Garg

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - server/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/**/*.map"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"

extraResources:
  - from: build/icon.ico
    to: icon.ico

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName}-Windows-${version}.${ext}"
  legalTrademarks: FullCode IDE

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FullCode IDE
  uninstallDisplayName: FullCode IDE

portable:
  artifactName: "${productName}-Portable-Win-${version}.${ext}"

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: native/AppIcon.icns
  category: public.app-category.developer-tools
  artifactName: "${productName}-macOS-${version}.${ext}"
